<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Story | Inspire Stars Academy Rwanda</title><link rel="icon" href="favicon.ico"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><style>:root{--ink:#193044;--muted:#71808a;--line:#dfe5e5;--paper:#fbfcfa;--green:#174d43;--orange:#e87c42;--display:'Playfair Display',Georgia,serif;--sans:'DM Sans',system-ui,sans-serif;--mono:'DM Mono',monospace}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.75 var(--sans)}.wrap{max-width:940px;margin:auto;padding:0 24px}.top{height:82px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.brand{display:flex;gap:11px;align-items:center;color:var(--green);font-weight:700;font-size:12px;letter-spacing:.07em;text-transform:uppercase;line-height:1.15}.mark{width:34px;height:34px;border:2px solid var(--orange);border-radius:50%;display:grid;place-items:center}.back{color:var(--green);font-size:13px;font-weight:600}.article{padding:66px 0 90px}.category{color:var(--orange);font:11px var(--mono);letter-spacing:.13em;text-transform:uppercase}.article h1{font:700 clamp(40px,7vw,70px)/1.05 var(--display);max-width:800px;margin:15px 0}.dek{font-size:19px;color:var(--muted);max-width:680px}.date{font:11px var(--mono);color:var(--muted);margin:22px 0 34px}.hero{width:100%;max-height:530px;object-fit:cover;border-radius:6px;margin-bottom:39px}.body{max-width:680px;margin:auto;font-size:17px}.body p{margin:0 0 22px}.body h2{font:700 30px/1.2 var(--display);margin:34px 0 12px}.missing{text-align:center;padding:100px 0}@media(max-width:700px){.wrap{padding:0 17px}.top{height:68px}.article{padding:47px 0 60px}.dek{font-size:17px}}</style></head><body><header class="top wrap"><a class="brand" href="index.html"><span class="mark">IS</span><span>Inspire Stars<br>Academy</span></a><a class="back" href="stories.html">← All stories</a></header><main class="wrap" id="article"></main><script>const saved=JSON.parse(localStorage.getItem('isa-editorial-stories-v1')||'null')||[];const key=new URLSearchParams(location.search).get('id');const story=saved.find(s=>(s.slug||s.id)===key&&s.status==='published');const date=v=>new Intl.DateTimeFormat('en',{month:'long',day:'numeric',year:'numeric'}).format(new Date(v+'T12:00:00'));const body=t=>(t||'').split(/\n\n+/).map(p=>p.startsWith('## ')?`<h2>${p.slice(3)}</h2>`:`<p>${p.replace(/\n/g,'<br>')}</p>`).join('');document.title=story?`${story.title} | Inspire Stars Academy Rwanda`:'Story not found | Inspire Stars Academy';document.getElementById('article').innerHTML=story?`<article class="article"><span class="category">${story.category}</span><h1>${story.title}</h1><p class="dek">${story.excerpt||''}</p><div class="date">Published ${date(story.date)}</div><img class="hero" src="${story.image||'images/hero.jpg'}" alt=""><div class="body">${body(story.body)}</div></article>`:'<div class="missing"><h1>Story not found</h1><p><a class="back" href="stories.html">Return to stories</a></p></div>';</script></body></html>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>(async()=>{try{const key=new URLSearchParams(location.search).get('id');const db=supabase.createClient(ISA_SUPABASE.url,ISA_SUPABASE.publishableKey);const r=await db.from('stories').select('*').eq('slug',key).eq('status','published').maybeSingle();if(r.error||!r.data)return;const s=r.data;document.title=`${s.title} | Inspire Stars Academy Rwanda`;document.getElementById('article').innerHTML=`<article class="article"><span class="category">${s.category}</span><h1>${s.title}</h1><p class="dek">${s.excerpt||''}</p><div class="date">Published ${date(s.publish_date)}</div><img class="hero" src="${s.image_url||'images/hero.jpg'}" alt=""><div class="body">${body(s.body)}</div></article>`}catch(e){console.warn('Live story unavailable',e)}})();</script>
<script>
  (() => {
    const style = document.createElement('style');
    style.textContent = '.story-gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:39px}.story-gallery img{width:100%;height:260px;object-fit:cover;border-radius:6px}.story-gallery img:first-child{grid-column:1/-1;height:530px}@media(max-width:700px){.story-gallery{grid-template-columns:1fr}.story-gallery img,.story-gallery img:first-child{height:260px}}';
    document.head.appendChild(style);
    const key = new URLSearchParams(location.search).get('id');
    if (!key || typeof supabase === 'undefined' || typeof ISA_SUPABASE === 'undefined') return;
    const client = supabase.createClient(ISA_SUPABASE.url, ISA_SUPABASE.publishableKey);
    const formatDate = value => new Intl.DateTimeFormat('en', { month: 'long', day: 'numeric', year: 'numeric' }).format(new Date(value + 'T12:00:00'));
    const formatBody = text => (text || '').split(/\n\n+/).map(part => part.startsWith('## ') ? `<h2>${part.slice(3)}</h2>` : `<p>${part.replace(/\n/g, '<br>')}</p>`).join('');
    client.from('stories').select('*').eq('slug', key).eq('status', 'published').maybeSingle().then(({ data }) => {
      if (!data) return;
      const images = Array.isArray(data.gallery_urls) && data.gallery_urls.length ? data.gallery_urls : (data.image_url ? [data.image_url] : ['images/hero.jpg']);
      const gallery = `<div class="story-gallery">${images.map((url, index) => `<img src="${url}" alt="${data.title}${images.length > 1 ? `, image ${index + 1}` : ''}">`).join('')}</div>`;
      document.title = `${data.seo_title || data.title} | Inspire Stars Academy Rwanda`;
      document.getElementById('article').innerHTML = `<article class="article"><span class="category">${data.category}</span><h1>${data.title}</h1><p class="dek">${data.excerpt || ''}</p><div class="date">Published ${formatDate(data.publish_date)}</div>${gallery}<div class="body">${formatBody(data.body)}</div></article>`;
    });
  })();
</script>
<script>
  (() => {
    const fallback = {
      'building-confidence-beyond-the-pitch': { title: 'Building confidence beyond the pitch', category: 'Player spotlight', date: '2026-08-22', excerpt: 'The habits that help young athletes grow every day.', image: 'images/gal-20.jpg', body: 'Every training session is an opportunity to grow in confidence, discipline and teamwork.\n\nAt Inspire Stars Academy, progress is measured beyond the final score.' },
      'a-new-season-of-possibilities': { title: 'A new season of possibilities', category: 'Academy news', date: '2026-08-09', excerpt: 'Training, community and international pathways for the season ahead.', image: 'images/gal-06.jpg', body: 'A new season brings fresh goals, new friendships and more opportunities for young athletes to develop.' }
    };
    const key = new URLSearchParams(location.search).get('id');
    if (!key || !fallback[key] || typeof supabase === 'undefined' || typeof ISA_SUPABASE === 'undefined') return;
    const client = supabase.createClient(ISA_SUPABASE.url, ISA_SUPABASE.publishableKey);
    client.from('stories').select('id').eq('slug', key).eq('status', 'published').maybeSingle().then(({ data }) => {
      if (data) return;
      const s = fallback[key];
      const date = value => new Intl.DateTimeFormat('en', { month: 'long', day: 'numeric', year: 'numeric' }).format(new Date(value + 'T12:00:00'));
      const body = text => text.split(/\n\n+/).map(part => `<p>${part}</p>`).join('');
      document.title = `${s.title} | Inspire Stars Academy Rwanda`;
      document.getElementById('article').innerHTML = `<article class="article"><span class="category">${s.category}</span><h1>${s.title}</h1><p class="dek">${s.excerpt}</p><div class="date">Published ${date(s.date)}</div><img class="hero" src="${s.image}" alt="${s.title}"><div class="body">${body(s.body)}</div></article>`;
    });
  })();
</script>
