<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live editorial desk | Inspire Stars Academy</title><link rel="icon" href="favicon.ico"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><style>:root{--ink:#193044;--muted:#71808a;--line:#dfe5e5;--paper:#fbfcfa;--green:#174d43;--orange:#e87c42;--mint:#e5f0ec;--display:'Playfair Display',Georgia,serif;--sans:'DM Sans',system-ui,sans-serif;--mono:'DM Mono',monospace}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.55 var(--sans)}button,input,textarea,select{font:inherit}button{cursor:pointer}.shell{max-width:1120px;margin:auto;padding:0 24px}.top{height:78px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;color:var(--green);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;line-height:1.1}.mark{width:34px;height:34px;border:2px solid var(--orange);border-radius:50%;display:grid;place-items:center}.top a{color:var(--green);font-weight:600;font-size:13px}.page{padding:54px 0}.intro{display:flex;justify-content:space-between;align-items:end;margin-bottom:28px}.kicker{font:11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--orange);margin:0 0 10px}.intro h1{font:700 48px/1.05 var(--display);margin:0 0 8px}.intro p{color:var(--muted);margin:0}.button{border:1px solid var(--line);background:#fff;border-radius:4px;padding:10px 14px;font-weight:700;color:var(--ink)}.button.primary{background:var(--orange);color:#fff;border-color:var(--orange)}.layout{display:grid;grid-template-columns:330px 1fr;gap:22px}.panel{background:#fff;border:1px solid var(--line);border-radius:6px;padding:20px}.panel h2{font:700 23px var(--display);margin:0 0 18px}.list{display:grid;gap:8px}.item{width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:4px;padding:12px}.item.active{border-color:var(--green);box-shadow:0 5px 18px #19304412}.item strong{display:block;margin-bottom:4px}.item small{color:var(--muted)}.status{font:10px var(--mono);text-transform:uppercase;color:var(--green)}.status.draft{color:var(--orange)}label{display:block;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin:0 0 6px}.field{margin-bottom:15px}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:4px;padding:10px;color:var(--ink);background:#fff}textarea{min-height:185px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.check{display:flex;align-items:center;gap:8px;color:var(--ink);font-weight:600;font-size:13px;margin:4px 0 20px}.check input{width:auto}.actions{display:flex;justify-content:flex-end;gap:8px}.auth{max-width:430px;margin:14vh auto;text-align:center}.auth h1{font:700 40px var(--display)}.auth p{color:var(--muted)}.auth form{text-align:left;margin-top:25px}.message{margin-top:14px;color:var(--orange);font-size:13px}.hidden{display:none!important}@media(max-width:760px){.shell{padding:0 17px}.page{padding:35px 0}.intro{display:block}.intro .button{margin-top:18px}.intro h1{font-size:40px}.layout{grid-template-columns:1fr}.row{grid-template-columns:1fr}}
  </style></head><body><header class="top shell"><a class="brand" href="index.html"><span class="mark">IS</span><span>Inspire Stars<br>Academy</span></a><div><a href="stories.html">View stories ↗</a> <button class="button hidden" id="logout" type="button">Sign out</button></div></header><main class="shell"><section class="auth" id="auth"><p class="kicker">Secure publishing</p><h1>Welcome to the desk.</h1><p>Sign in with your admin email to manage academy stories.</p><form id="login"><label for="email">Admin email</label><input id="email" type="email" required placeholder="you@example.com"><button class="button primary" style="margin-top:14px;width:100%" type="submit">Send magic link</button><div class="message" id="auth-message"></div></form></section><section class="page hidden" id="desk"><div class="intro"><div><p class="kicker">Live workspace</p><h1>Editorial desk</h1><p id="signed-in"></p></div><button class="button primary" id="new">＋ New story</button></div><div class="layout"><section class="panel"><h2>Stories</h2><div class="list" id="list"></div></section><section class="panel"><h2 id="heading">Create a story</h2><form id="story-form"><input id="story-id" type="hidden"><input id="image-url" type="hidden"><div class="field"><label for="title">Title</label><input id="title" required></div><div class="row"><div class="field"><label for="category">Category</label><select id="category"><option>Academy news</option><option>Player spotlight</option><option>Community</option><option>Events</option><option>Pathways</option></select></div><div class="field"><label for="date">Publish date</label><input id="date" type="date"></div></div><div class="field"><label for="image">Cover image</label><input id="image" type="file" accept="image/jpeg,image/png,image/webp"><small style="color:var(--muted);font-size:11px">Images are stored in Supabase Storage.</small></div><div class="field"><label for="excerpt">Short description</label><textarea id="excerpt" style="min-height:90px"></textarea></div><div class="field"><label for="body">Story content</label><textarea id="body"></textarea></div><label class="check"><input id="featured" type="checkbox"> Feature on public stories page</label><div class="actions"><button class="button" id="save" type="button">Save draft</button><button class="button primary" type="submit">Publish story</button></div><div class="message" id="story-message"></div></form></section></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>
    const {createClient}=supabase;const db=createClient(ISA_SUPABASE.url,ISA_SUPABASE.publishableKey);const $=id=>document.getElementById(id);let user=null;let stories=[];const today=()=>new Date().toISOString().slice(0,10);const slug=v=>v.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');const msg=(id,t)=>$(id).textContent=t;
    async function load(){const {data,error}=await db.from('stories').select('*').order('publish_date',{ascending:false});if(error){msg('story-message',error.message);return}stories=data||[];$('list').innerHTML=stories.length?stories.map(s=>`<button class="item" data-id="${s.id}" type="button"><strong>${s.title}</strong><small>${s.category} · <span class="status ${s.status}">${s.status}</span></small></button>`).join(''):'<p style="color:var(--muted)">No stories yet.</p>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>edit(stories.find(s=>s.id===b.dataset.id)));}
    function reset(){ $('story-form').reset();$('story-id').value='';$('date').value=today();$('heading').textContent='Create a story';msg('story-message','');}
    function edit(s){$('story-id').value=s.id;$('image-url').value=s.image_url||'';$('title').value=s.title;$('category').value=s.category;$('date').value=s.publish_date;$('excerpt').value=s.excerpt;$('body').value=s.body;$('featured').checked=s.featured;$('heading').textContent='Edit story';}
    async function save(status){const title=$('title').value.trim();if(!title)return;let imageUrl=$('image-url').value||null;const file=$('image').files[0];if(file){if(file.size>5*1024*1024){msg('story-message','Please choose an image under 5 MB.');return}const path=`${user.id}/${crypto.randomUUID()}-${file.name.replace(/[^a-zA-Z0-9._-]/g,'-')}`;const upload=await db.storage.from('story-images').upload(path,file,{upsert:true,contentType:file.type});if(upload.error){msg('story-message',upload.error.message);return}imageUrl=db.storage.from('story-images').getPublicUrl(path).data.publicUrl}$('image-url').value=imageUrl||'';const payload={title,slug:slug($('title').value),category:$('category').value,excerpt:$('excerpt').value.trim(),body:$('body').value.trim(),image_url:imageUrl,featured:$('featured').checked,status,publish_date:$('date').value||today(),author_id:user.id};const id=$('story-id').value;const result=id?await db.from('stories').update(payload).eq('id',id):await db.from('stories').insert(payload);if(result.error){msg('story-message',result.error.message);return}msg('story-message',status==='published'?'Published successfully.':'Draft saved.');await load();}
    $('login').onsubmit=async e=>{e.preventDefault();const {error}=await db.auth.signInWithOtp({email:$('email').value.trim(),options:{emailRedirectTo:location.href}});msg('auth-message',error?error.message:'Check your email for the sign-in link.');};$('logout').onclick=()=>db.auth.signOut();$('new').onclick=reset;$('save').onclick=()=>save('draft');$('story-form').onsubmit=e=>{e.preventDefault();save('published')};db.auth.onAuthStateChange(async(_event,session)=>{user=session?.user||null;if(!user){$('auth').classList.remove('hidden');$('desk').classList.add('hidden');$('logout').classList.add('hidden');return}$('auth').classList.add('hidden');$('desk').classList.remove('hidden');$('logout').classList.remove('hidden');$('signed-in').textContent=`Signed in as ${user.email}`;await load();reset();});
  </script></body></html>
<script>(function(){const desk=document.getElementById('desk');if(!desk)return;const layout=desk.querySelector('.layout');const stats=document.createElement('div');stats.id='stats';stats.style='display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px';stats.innerHTML='<div class="panel"><small>Published</small><strong id="stat-published" style="display:block;font:700 30px var(--display);margin-top:6px">0</strong></div><div class="panel"><small>Drafts</small><strong id="stat-drafts" style="display:block;font:700 30px var(--display);margin-top:6px">0</strong></div><div class="panel"><small>Featured</small><strong id="stat-featured" style="display:block;font:700 30px var(--display);margin-top:6px">0</strong></div>';layout.parentNode.insertBefore(stats,layout);const list=document.getElementById('list');const tools=document.createElement('div');tools.style='display:flex;gap:7px;margin:-7px 0 13px';tools.innerHTML='<input id="dashboard-search" type="search" placeholder="Search stories" aria-label="Search stories" style="min-width:0"><select id="dashboard-filter" aria-label="Filter stories" style="width:112px"><option value="all">All</option><option value="published">Published</option><option value="draft">Drafts</option></select>';list.parentNode.insertBefore(tools,list);function safe(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function draw(){const q=document.getElementById('dashboard-search').value.toLowerCase();const f=document.getElementById('dashboard-filter').value;const visible=stories.filter(s=>(f==='all'||s.status===f)&&(!q||(s.title+' '+s.category).toLowerCase().includes(q)));const html=visible.length?visible.map(s=>`<button class="item" data-id="${s.id}" type="button"><strong>${safe(s.title)}</strong><small>${safe(s.category)} · <span class="status ${s.status}">${s.status}</span>${s.featured?' · Featured':''}</small></button>`).join(''):'<p style="color:var(--muted)">No matching stories.</p>';if(list.innerHTML!==html)list.innerHTML=html;list.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>edit(stories.find(s=>s.id===b.dataset.id)));document.getElementById('stat-published').textContent=stories.filter(s=>s.status==='published').length;document.getElementById('stat-drafts').textContent=stories.filter(s=>s.status==='draft').length;document.getElementById('stat-featured').textContent=stories.filter(s=>s.featured).length}document.getElementById('dashboard-search').oninput=draw;document.getElementById('dashboard-filter').onchange=draw;new MutationObserver(()=>setTimeout(draw,0)).observe(list,{childList:true});setInterval(()=>{if(stories.length)draw()},1500)})();</script>
<script>if(location.pathname.endsWith('/admin-live.html'))history.replaceState(null,'','/admin'+location.search+location.hash);</script>
<script>document.querySelectorAll('a[href="index.html"]').forEach(a=>a.href='/');document.querySelectorAll('a[href="stories.html"]').forEach(a=>a.href='/stories');</script>
<script>(function(){const desk=document.getElementById('desk');if(!desk)return;const actions=document.querySelector('.intro');const backup=document.createElement('button');backup.className='button';backup.type='button';backup.textContent='Export backup';backup.style.marginRight='8px';backup.onclick=()=>{const file=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),stories},null,2)],{type:'application/json'});const link=document.createElement('a');link.href=URL.createObjectURL(file);link.download=`inspire-stars-stories-${new Date().toISOString().slice(0,10)}.json`;link.click();URL.revokeObjectURL(link.href)};actions.querySelector('#new').before(backup);const status=document.createElement('select');status.id='visibility';status.innerHTML='<option value="draft">Save as draft</option><option value="scheduled">Schedule for publish date</option><option value="published">Publish now</option>';status.style='margin-right:8px';$('save').replaceWith(Object.assign($('save').cloneNode(true),{id:'save'}));document.querySelector('.actions').prepend(status);document.getElementById('save').onclick=()=>save(status.value);document.getElementById('story-form').onsubmit=e=>{e.preventDefault();save('published')};})();</script>
