<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stories | Inspire Stars Academy Rwanda</title>
  <link rel="icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#193044;--muted:#71808a;--line:#dfe5e5;--paper:#fbfcfa;--green:#174d43;--orange:#e87c42;--gold:#eabf52;--display:'Playfair Display',Georgia,serif;--sans:'DM Sans',system-ui,sans-serif;--mono:'DM Mono',monospace}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.65 var(--sans)}a{color:inherit;text-decoration:none}.wrap{max-width:1120px;margin:auto;padding:0 24px}.top{height:82px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.brand{display:flex;gap:11px;align-items:center;color:var(--green);font-weight:700;font-size:12px;letter-spacing:.07em;text-transform:uppercase;line-height:1.15}.mark{width:34px;height:34px;border:2px solid var(--orange);border-radius:50%;display:grid;place-items:center}.back{font-size:13px;font-weight:600;color:var(--green)}.intro{padding:72px 0 45px;max-width:710px}.kicker{color:var(--orange);font:11px var(--mono);letter-spacing:.15em;text-transform:uppercase;margin:0 0 13px}.intro h1{font:700 clamp(42px,7vw,72px)/1.02 var(--display);margin:0 0 18px}.intro p{color:var(--muted);font-size:17px;margin:0}.stories{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;padding-bottom:80px}.story{background:#fff;border:1px solid var(--line);border-radius:6px;overflow:hidden}.story img{width:100%;height:205px;object-fit:cover;background:#e5f0ec}.story-body{padding:19px}.category{font:10px var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--orange)}.story h2{font:700 23px/1.2 var(--display);margin:9px 0 10px}.story p{color:var(--muted);margin:0 0 18px;font-size:13px}.date{font-size:11px;color:var(--muted);border-top:1px solid var(--line);padding-top:13px}.empty{border:1px dashed var(--line);padding:34px;color:var(--muted);grid-column:1/-1;text-align:center}@media(max-width:760px){.wrap{padding:0 17px}.intro{padding:50px 0 32px}.stories{grid-template-columns:1fr;gap:14px}.story img{height:220px}.top{height:68px}.back{font-size:12px}}
  </style>
</head>
<body>
  <header class="top wrap"><a class="brand" href="index.html"><span class="mark">IS</span><span>Inspire Stars<br>Academy</span></a><a class="back" href="index.html">← Back to academy</a></header>
  <main class="wrap"><section class="intro"><p class="kicker">From the academy</p><h1>Stories worth sharing.</h1><p>Training days, community moments and the people helping young athletes find their next opportunity.</p></section><section class="stories" id="stories" aria-label="Published stories"></section></main>
  <script>
    const seed=[{title:'Building confidence beyond the pitch',category:'Player spotlight',date:'2026-08-22',excerpt:'The habits that help young athletes grow every day.',image:'images/gal-20.jpg'},{title:'A new season of possibilities',category:'Academy news',date:'2026-08-09',excerpt:'Training, community and international pathways for the season ahead.',image:'images/gal-06.jpg'}];
    const saved=JSON.parse(localStorage.getItem('isa-editorial-stories-v1')||'null'); const stories=(saved||seed).filter(s=>!saved||s.status==='published');
    const formatDate=value=>new Intl.DateTimeFormat('en',{month:'long',day:'numeric',year:'numeric'}).format(new Date(value+'T12:00:00'));
    document.getElementById('stories').innerHTML=stories.length?stories.map(s=>`<article class="story"><img src="${s.image||'images/hero.jpg'}" alt=""><div class="story-body"><span class="category">${s.category}</span><h2>${s.title}</h2><p>${s.excerpt||''}</p><div class="date">${formatDate(s.date)}</div><a class="back" href="story.html?id=${encodeURIComponent(s.slug||s.id)}">Read story ↗</a></div></article>`).join(''):'<div class="empty">New stories are on their way.</div>';
  </script>
</body>
</html>
